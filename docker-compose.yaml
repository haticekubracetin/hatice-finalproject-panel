services:
  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    environment:
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=hatice-finalproject-panel
    volumes:
      # This maps your current local folder to the Grafana plugins folder
      - .:/var/lib/grafana/plugins/hatice-finalproject-panel
